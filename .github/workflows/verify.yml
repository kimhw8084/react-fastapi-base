name: React-FastAPI Base full platform verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: react-fastapi-base-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-09-06
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'
      - name: Require reviewed frontend lock
        run: |
          test -f frontend/package-lock.json || { echo 'BLOCKED: resolve and review frontend/package-lock.json first'; exit 1; }
      - name: Install backend and audit tooling
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install -r backend/requirements-tools.txt
          python -m pip install -r experience-lab/requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Install frontend exactly
        working-directory: frontend
        run: npm ci
      - name: Install browser runtime
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Authoritative code gate
        run: python scripts/verify.py --output .evidence/ci
      - name: Keep verification and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-code-evidence
          path: |
            .evidence/ci/
            frontend/playwright-report/
            frontend/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
