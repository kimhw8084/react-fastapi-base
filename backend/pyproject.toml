[project]
name = "react-fastapi-base-backend"
version = "1.0.0rc1"
requires-python = ">=3.11,<3.15"
dependencies = ["fastapi==0.141.1", "starlette==1.6.0", "uvicorn==0.52.4", "sqlalchemy==2.0.50", "alembic==1.18.4", "pydantic==2.13.4", "pydantic-settings==2.14.2"]

[project.optional-dependencies]
test = ["pytest==9.0.3", "httpx==0.28.1", "httpx2==2.12.0", "pytest-cov==7.0.0", "playwright==1.62.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
