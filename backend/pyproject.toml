[project]
name = "react-fastapi-base-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = ["fastapi==0.128.2", "uvicorn==0.48.0", "sqlalchemy==2.0.50", "alembic==1.18.4", "pydantic==2.13.4", "pydantic-settings==2.14.1"]

[project.optional-dependencies]
test = ["pytest==9.0.2", "httpx==0.28.1", "pytest-cov==7.0.0", "playwright==1.57.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
